version: '3.8'
services:
  app:
    build: .
    container_name: webhookflow-app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    command: ["sh", "-c", "npm run db:generate && npm run db:migrate && node dist/main.js"]

  worker:
    build: .
    container_name: webhookflow-worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["node", "dist/worker/job-worker.js"]
    restart: on-failure

  postgres:
    image: postgres:15-alpine
    container_name: webhookflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhookflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: webhookflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  samuraizer:
    image: mabumualla/ai-youtube-summarizer:latest
    container_name: webhookflow-samuraizer
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
    ports:
      - "8000:8000"

volumes:
  pgdata: